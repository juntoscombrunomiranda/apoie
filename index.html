<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bruno Miranda para Deputado Estadual!</title>

  <!-- SEO -->
  <meta name="description" content="Adicione nossa moldura em sua foto de perfil e compartilhe!">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Bruno Miranda para Deputado Estadual!">
  <meta property="og:description" content="Adicione nossa moldura em sua foto de perfil e compartilhe!">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://juntoscombrunomiranda.github.io/apoie/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bruno Miranda para Deputado Estadual!">
  <meta name="twitter:description" content="Adicione nossa moldura em sua foto de perfil e compartilhe!">
  <meta name="twitter:image" content="">

  <!-- Favicon -->
  <link rel="icon" href="Selo Vote.svg" type="image/svg+xml">

  <!-- Bibliotecas e fontes -->
  <script src="https://cdn.jsdelivr.net/npm/konva@8.4.3/konva.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,900;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       FUNDO ANIMADO SVG
       ========================= -->

  <svg
    class="background-svg"
    preserveAspectRatio="xMidYMid slice"
    viewBox="10 10 80 80"
    aria-hidden="true"
  >
    <defs>
      <style>
        @keyframes rotate {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        .out-top {
          animation: rotate 20s linear infinite;
          transform-origin: 13px 25px;
        }

        .in-top {
          animation: rotate 10s linear infinite;
          transform-origin: 13px 25px;
        }

        .out-bottom {
          animation: rotate 25s linear infinite;
          transform-origin: 84px 93px;
        }

        .in-bottom {
          animation: rotate 15s linear infinite;
          transform-origin: 84px 93px;
        }
      </style>
    </defs>

    <path
      fill="#0361d4"
      class="out-top"
      d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"
    />

    <path
      fill="#005bcb"
      class="in-top"
      d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"
    />

    <path
      fill="#0361d4"
      class="out-bottom"
      d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z"
    />

    <path
      fill="#005bcb"
      class="in-bottom"
      d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z"
    />
  </svg>


  <!-- =========================
       LOGO NO TOPO
       ========================= -->

  <img
    src="Logo-Bruno-Miranda.gif"
    alt="Logo Bruno Miranda"
    class="top-logo"
  >


  <!-- =========================
       TÍTULO
       ========================= -->

  <div class="title-container">

    <h1>Vista a camisa do nosso time!</h1>

    <p>
      Adicione nossa moldura em sua foto de perfil e compartilhe!
    </p>

  </div>


  <!-- =========================
       EDITOR DO TWIBBON
       ========================= -->

  <div class="container">

    <!-- Switch de moldura -->
    <div class="frame-switch">

      <input
        type="radio"
        id="azul"
        name="frameOption"
        value="azul"
        checked
      >

      <label for="azul">
        Azul
      </label>


      <input
        type="radio"
        id="verde"
        name="frameOption"
        value="verde"
      >

      <label for="verde">
        Verde
      </label>

    </div>


    <!-- Canvas -->
    <div id="canvas-container"></div>


    <!-- Controles -->
    <div class="controls">

      <button id="choose-file">
        Escolha sua foto
      </button>

      <input
        type="file"
        id="file-input"
        accept="image/*"
      >

      <button id="download">
        Baixar foto
      </button>

    </div>

  </div>


  <!-- Script do Twibbon -->
  <script src="script.js"></script>

</body>
</html>
