<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bruno Miranda para Deputado Estadual!</title>

  <!-- SEO -->
  <meta name="description" content="Adicione nossa moldura em sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Bruno Miranda para Deputado Estadual!">
  <meta property="og:description" content="Adicione nossa moldura em sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bruno Miranda para Deputado Estadual!">
  <meta name="twitter:description" content="Adicione nossa moldura em sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">

  <!-- Favicon -->
  <link rel="icon" href="Selo Vote.svg" type="image/svg+xml">

  <!-- Bibliotecas e fontes -->
  <script src="https://cdn.jsdelivr.net/npm/konva@8.4.3/konva.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,900;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Logo no topo -->
  <img src="Negativa Vertical.svg" alt="Logo Bruno Miranda" class="top-logo">

  <!-- Container do título -->
  <div class="title-container">
    <h1>Vista a camisa do nosso time!</h1>
    <p>Adicione nossa moldura em sua foto de perfil e apoie nossa campanha!</p>
  </div>

  <!-- Container do editor -->
  <div class="container">

    <!-- Switch de moldura -->
    <div class="frame-switch">
      <input type="radio" id="azul" name="frameOption" value="azul" checked>
      <label for="azul">Azul</label>

      <input type="radio" id="verde" name="frameOption" value="verde">
      <label for="verde">Verde</label>
    </div>

    <!-- Canvas -->
    <div id="canvas-container"></div>

    <!-- Controles -->
    <div class="controls">
      <button id="choose-file">Escolha sua foto</button>
      <input type="file" id="file-input" accept="image/*">
      <button id="download">Baixar foto</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
