<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bruno Miranda | Deputado Estadual</title>

  <!-- SEO -->
  <meta name="description" content="Adicione nossa moldura à sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">

  <!-- Open Graph -->
  <meta property="og:title" content="Bruno Miranda | Deputado Estadual">
  <meta property="og:description" content="Adicione nossa moldura à sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bruno Miranda | Deputado Estadual">
  <meta name="twitter:description" content="Adicione nossa moldura à sua foto de perfil e compartilhe seu apoio ao Bruno Miranda.">

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Konva -->
  <script src="https://cdn.jsdelivr.net/npm/konva@8.4.3/konva.min.js"></script>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,900;1,500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Logo -->
  <img src="logo.svg" alt="Bruno Miranda" class="top-logo">

  <!-- Título -->
  <div class="title-container">
    <h1>Use nossa moldura!</h1>
    <p>Adicione nossa moldura à sua foto de perfil e compartilhe seu apoio.</p>
  </div>

  <!-- Editor -->
  <div class="container">

    <!-- Opções de moldura -->
    <div class="frame-switch">
      <input type="radio" id="apoiador" name="frameOption" value="apoiador" checked>
      <label for="apoiador">Sou apoiador</label>
    </div>

    <!-- Canvas -->
    <div id="canvas-container"></div>

    <!-- Controles -->
    <div class="controls">
      <button id="choose-file">Escolha sua foto</button>
      <input type="file" id="file-input" accept="image/*">
      <button id="download">Baixar foto</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
